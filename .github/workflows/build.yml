name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ambil binary proot/qemu + rootfs game + server game
        run: bash scripts/fetch-binaries.sh
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Bangun rootfs MariaDB (Alpine arm64)
        run: bash scripts/build-mariadb-rootfs.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OmpHub-debug
          path: app/build/outputs/apk/debug/*.apk
