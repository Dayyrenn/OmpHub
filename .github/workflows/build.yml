name: build-apk
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            task: assembleArm64Release
          - abi: armv7
            task: assembleArmv7Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Ambil binary proot/qemu + rootfs game
        env:
          QEMU_VERSION: "8.2.2"
          QEMU_SOURCE: "ubuntu"
        run: bash scripts/fetch-binaries.sh ${{ matrix.abi }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm
      - name: Bangun rootfs MariaDB (Alpine)
        run: bash scripts/build-mariadb-rootfs.sh ${{ matrix.abi }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Siapkan keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/omphub.jks"
      - name: Build APK release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/omphub.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:${{ matrix.task }} --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: OmpHub-${{ matrix.abi }}-release
          path: app/build/outputs/apk/**/release/*.apk

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: OmpHub-*-release
          path: dist
          merge-multiple: true
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -name '*.apk' -print
          bash scripts/release-notes.sh "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md \
            $(find dist -name '*.apk')