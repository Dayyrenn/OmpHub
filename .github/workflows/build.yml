name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            task: assembleArm64Release
          - abi: armv7
            task: assembleArmv7Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Ambil binary proot/qemu + rootfs game
        env:
          QEMU_VERSION: "8.2.2"
          QEMU_SOURCE: "ubuntu"
        run: bash scripts/fetch-binaries.sh ${{ matrix.abi }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm
      - name: Bangun rootfs MariaDB (Alpine)
        run: bash scripts/build-mariadb-rootfs.sh ${{ matrix.abi }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Siapkan keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/omphub.jks"
      - name: Build APK release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/omphub.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:${{ matrix.task }} --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: OmpHub-${{ matrix.abi }}-release
          path: app/build/outputs/apk/**/release/*.apk